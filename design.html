<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>出退勤管理システム</title>
  <style>
    /* ===== 共通 ===== */
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6;
    }

    header {
      color: #fff;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 16px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 22px;
      margin: 0;
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    input[type="time"], input[type="date"] {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      text-align: center;
    }

    th {
      background: #fff7ed;
    }

    /* ===== 出勤（緑） ===== */
    body.clock-in header { background: #22c55e; }
    body.clock-in button { background: #16a34a; }

    /* ===== 退勤（青） ===== */
    body.clock-out header { background: #3b82f6; }
    body.clock-out button { background: #1d4ed8; }

    /* ===== 一覧（オレンジ） ===== */
    body.record header { background: #f59e0b; }

    .filter {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .filter button {
      width: auto;
      padding: 12px 24px;
      background: #ea580c;
    }
  </style>
</head>

<!-- ======================== -->
<!-- 出勤時刻入力画面       -->
<!-- body class="clock-in" -->
<!-- ======================== -->
<body class="clock-in">

<header>
  <h1>出勤打刻</h1>
  <div>2026/01/09</div>
</header>

<div class="container">
  <div class="card">
    <h2>出勤時刻を入力</h2>
    <input type="time" value="09:00" />
    <button>出勤する</button>
  </div>
</div>

</body>
</html>

<!--
============================
下記のように body クラスを変えるだけで画面切替できます

■ 退勤時刻入力画面
<body class="clock-out">
  タイトル：退勤打刻
  ボタン：退勤する

■ 全記録一覧画面
<body class="record">
  一覧テーブルを表示
============================
-->
